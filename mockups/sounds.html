<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d12">
  <title>Badoku-Extreme Töne</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230c0d12%27/%3E%3Cpath d=%27M9 8h14v4h-9v3h7a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H9v-4h9v-3h-7a3 3 0 0 1-3-3V8z%27 fill=%27%23c5f135%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/tv.css">
  <link rel="stylesheet" href="sounds.css">
</head>
<body>
  <header class="sx-bar">
    <h1 class="brand">Badoku<span class="brand-accent">-Extreme</span> <span class="sx-sub">Klang-Attrappe · nur der TV macht Töne, die Handys bleiben stumm</span></h1>
    <div class="sx-transport">
      <button class="btn btn-primary" id="play-all" type="button">▶ Alles abspielen</button>
      <button class="btn" id="stop" type="button">■ Stopp</button>
      <label class="sx-vol">Lautstärke <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    </div>
  </header>
  <div class="sx-page">
    <section class="sx-main">
      <nav class="sx-chapters" id="chapters" aria-label="Szenen"></nav>
      <div class="sx-stage" id="stage-box"><main class="tv" id="tv"></main></div>
      <div class="sx-caption" id="caption"><b>Szene wählen oder «Alles abspielen».</b><span>Rechts leuchtet jeder Ton auf, wenn er spielt.</span></div>
      <ol class="sx-log" id="log"></ol>
    </section>
    <aside class="sx-side">
      <h2 class="sx-h">Töne <small>Variante antippen = auswählen und anhören</small></h2>
      <div id="sounds"></div>
      <h2 class="sx-h">Deine Auswahl</h2>
      <pre class="sx-summary" id="summary"></pre>
      <button class="btn" id="copy" type="button">Auswahl kopieren</button>
    </aside>
  </div>
  <script src="mock-data.js"></script>
  <script type="module" src="sounds.js"></script>
</body>
</html>
